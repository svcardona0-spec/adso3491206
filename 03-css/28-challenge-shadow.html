<!DOCTYPE html>
<html lang="es">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>28-Challenge - Pixel Art Drácula</title>
    <link rel="stylesheet" href="../src/css/styles.css">
    <style>
        body.html {
            background: linear-gradient(135deg, #0b4f71 0%, #1a759f 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: #ffffff;
        }

        .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .mainmenu.internal {
            text-align: center;
            margin-bottom: 20px;
        }

        .mainmenu.internal h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .logo-container {
            margin: 10px 0;
        }

        .module-logo {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 4px solid #ffffff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .mainmenu.internal h3 {
            font-size: 1rem;
            font-weight: 400;
            margin-top: 5px;
            color: #e0fbfc;
        }

        .demo-container {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-top: 10px;
        }

        .pixel-art-wrapper {
            background-color: #1b263b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
            border: 2px solid #415a77;
        }

        .pixel-canvas-container {
            width: 340px;
            height: 420px;
            position: relative;
            background-color: #ffffff;
            border-radius: 6px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);
        }

        /* Posicionamiento ajustado para que todo el gráfico quede perfectamente centrado y visible */
        .div.dracula {
            width: 10px;
            height: 10px;
            background: transparent;
            position: absolute;
            top: 80px;
            left: 70px;
            box-shadow:

                30px 80px 0 #000000, 40px 80px 0 #ffffff, 50px 80px 0 #ffffff, 60px 80px 0 #ffffff, 70px 80px 0 #ffffff, 80px 80px 0 #ffffff, 90px 80px 0 #ffffff, 100px 80px 0 #ffffff, 110px 80px 0 #ffffff, 120px 80px 0 #ffffff, 130px 80px 0 #ffffff, 140px 80px 0 #000000,

</head>
<body class="html">

    <main class="container">
        <!-- Encabezado del reto -->
        <header class="mainmenu internal">
            <h1>28-Challenge</h1>
            <div class="logo-container">
                <img src="../src/imgs/logo-html.png" alt="Logo Challenge" class="module-logo">
            </div>
            <h3>Reto de Pixel Art: Drácula clásico con capa y cuello alto.</h3>
        </header>

        <!-- Contenedor del lienzo con el diseño de Drácula y los murciélagos -->

            <div class="pixel-art-wrapper">
                <div class="pixel-canvas-container">
                    <div class="div dracula"></div>
