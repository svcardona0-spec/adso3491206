<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>40-steps - Sprite Animation</title>
    <link rel="stylesheet" href="../src/css/styles.css">
    <style>
        /* Bloquear el scroll de la página por completo */
        body {
            overflow: hidden;
            margin: 0;
            padding: 0;
            height: 100vh;
            background: linear-gradient(135deg, #1b263b, #0d1b2a);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #ffffff;
        }

        .demo-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 420px;
            background-image: url('../src/imgs/bg-steps.png');
            background-size: cover;
            background-position: center;
            border-radius: 12px;
            border: 3px solid #415a77;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Texto de información de las flechas */
        .info {
            position: absolute;
            top: 15px;
            background-color: rgba(0, 0, 0, 0.75);
            color: #e0fbfc;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            border: 1px solid #778da9;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 10;
        }

        /* Contenedor del personaje con proporciones rectangulares exactas */
        #trainer {
            width: 32px;
            height: 48px;
            background-image: url('../src/imgs/steps-01.png');
            background-repeat: no-repeat;
            background-size: 128px 192px; /* Escala exacta 4x4 fotogramas de 32x48 */
            position: absolute;
            bottom: 60px; /* Posición inicial centrada frente a la puerta */
            left: 234px;
            z-index: 5;
            image-rendering: pixelated; /* Mantiene los píxeles nítidos estilo retro */
        }

        /* Direcciones / Filas de la hoja de sprites usando steps(4) */
        #trainer.front {
            background-position: 0px 0px;
            animation: walkAnim 0.6s steps(4) infinite;
        }

        #trainer.back {
            background-position: 0px -48px;
            animation: walkAnim 0.6s steps(4) infinite;
        }

        #trainer.left {
            background-position: 0px -96px;
            animation: walkAnim 0.6s steps(4) infinite;
        }

        #trainer.right {
            background-position: 0px -144px;
            animation: walkAnim 0.6s steps(4) infinite;
        }

        /* Animación de los 4 fotogramas en horizontal */
        @keyframes walkAnim {
            from {
                background-position-x: 0px;
            }
            to {
                background-position-x: -128px;
            }
        }
    </style>
</head>
<body class="html">

    <!-- Botón de navegación para regresar -->
    <nav class="back" style="position: absolute; top: 15px; left: 15px; z-index: 100;">
        <a href="index.html" title="Volver al menú">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 256 256">
                <path fill="#ffffff" d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"></path>
            </svg>
        </a>
    </nav>

    <main class="container" style="display: flex; flex-direction: column; align-items: center; width: 100%;">
        <!-- Encabezado con el logo de CSS completo -->
        <header class="mainmenu internal" style="text-align: center; margin-bottom: 8px;">
            <h1 style="font-size: 1.5rem; margin-bottom: 2px;">40-steps</h1>
            <div class="logo-container" style="margin: 2px 0;">
                <img src="../src/imgs/logo-css.png" alt="Logo CSS" style="width: 110px; height: auto; border-radius: 0; background: transparent; border: none; box-shadow: none;" class="module-logo">
            </div>
            <p style="color: #a0aec0; font-size: 0.85rem; max-width: 480px; margin: 2px 0;">Allows step-by-step animation of a sprite using the CSS steps() timing function.</p>
        </header>

        <!-- Escenario del reto -->
        <div class="demo-container">
            <!-- Instrucción de teclas -->
            <div class="info">
                Please press arrow keys &larr; &uarr; &rarr; &darr;
            </div>

            <!-- Personaje sprite con clase por defecto 'front' -->
            <div id="trainer" class="front"></div>
        </div>
    </main>

    <!-- Script JavaScript para controlar el movimiento y las direcciones con las teclas -->
    <script>
        const trainer = document.getElementById('trainer');
        
        let posX = 234;
        let posY = 60;
        const step = 8;

        window.addEventListener('keydown', (event) => {
            switch (event.code) {
                case 'ArrowUp':
                    trainer.className = 'back';
                    posY += step; // Sube dentro de la casa
                    if (posY > 180) posY = 180;
                    trainer.style.bottom = posY + 'px';
                    break;
                case 'ArrowDown':
                    trainer.className = 'front';
                    posY -= step; // Baja hacia la entrada
                    if (posY < 30) posY = 30;
                    trainer.style.bottom = posY + 'px';
                    break;
                case 'ArrowLeft':
                    trainer.className = 'left';
                    posX -= step; // Se mueve a la izquierda
                    if (posX < 40) posX = 40;
                    trainer.style.left = posX + 'px';
                    break;
                case 'ArrowRight':
                    trainer.className = 'right';
                    posX += step; // Se mueve a la derecha
                    if (posX < 430) posX = 430;
                    trainer.style.left = posX + 'px';
                    break;
            }
        });
    </script>

</body>
</html>
