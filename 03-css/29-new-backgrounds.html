<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>29-New Backgrounds - Múltiples, Gradientes y Clip</title>
    <link rel="stylesheet" href="../src/css/styles.css">
    <style>
        body.html {
            background: linear-gradient(135deg, #0b4f71 0%, #1a759f 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: #ffffff;
        }

        .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .mainmenu.internal {
            text-align: center;
            margin-bottom: 20px;
        }

        .mainmenu.internal h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .logo-container {
            margin: 10px 0;
        }

        .module-logo {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 4px solid #ffffff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .mainmenu.internal h3 {
            font-size: 1rem;
            font-weight: 400;
            margin-top: 5px;
            color: #e0fbfc;
        }

        .demo-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px; /* Espacio entre las cajas */
            margin-top: 10px;
            padding-bottom: 40px;
        }

        .pixel-art-wrapper {
            background-color: #1b263b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
            border: 2px solid #415a77;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .wrapper-title {
            font-size: 1.1rem;
            margin-bottom: 12px;
            color: #e0fbfc;
            font-weight: 600;
        }

        /* 1. Múltiples imágenes de fondo */
        .multiple-bg-box {
            width: 340px;
            height: 400px;
            border-radius: 6px;
            border: 1px solid #ccc;
            background-color: #ffffff;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);
            background-image: url('../src/imgs/bg3.png'), url('../src/imgs/bg2.png'), url('../src/imgs/bg1.png');
            background-position: bottom center, center center, top left;
            background-size: 120px, 200px, cover;
            background-repeat: no-repeat, no-repeat, no-repeat;
        }

        /* 2. Gradiente de tres colores */
        .gradient-box {
            width: 340px;
            height: 200px;
            border-radius: 6px;
            border: 1px solid #ccc;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);
            background: linear-gradient(135deg, #ff7e5f 0%, #feb47b 50%, #6a11cb 100%);
        }

        /* 3. Bgs Linear Gradients */
        .linear-gradient-box {
            width: 340px;
            height: 150px;
            border-radius: 6px;
            border: 1px solid #ccc;
            background: linear-gradient(to right, #ffef0f, #0072ff);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: bold;
        }

        /* 4. Bgs Radial Gradients */
        .radial-gradient-box {
            width: 340px;
            height: 150px;
            border-radius: 6px;
            border: 1px solid #ccc;
            background: radial-gradient(circle, #ffdee9 0%, #b5fffc 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
            font-weight: bold;
        }

        /* 5. Bgs Clip Text */
        .clip-text-box {
            width: 340px;
            height: 150px;
            border-radius: 6px;
            border: 1px solid #ccc;
            background-color: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .clip-text {
            font-size: 2.2rem;
            font-weight: 900;
            background: linear-gradient(45deg, #f3ec78, #af4261);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* 6. Bgs Mask Clip */
        .mask-clip-box {
            width: 340px;
            height: 150px;
            border-radius: 6px;
            border: 1px solid #ccc;
            background: linear-gradient(45deg, #11998e, #38ef7d);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 1.3rem;
            font-weight: bold;
            background-clip: padding-box;
            border: 10px solid rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body class="html">

    <!-- Botón de navegación para regresar -->
    <nav class="back">
        <a href="index.html" title="Volver al menú">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 256 256">
                <path fill="#ffffff" d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"></path>
            </svg>
        </a>
    </nav>

    <main class="container">
        <!-- Encabezado con título, logo y descripción del reto -->
        <header class="mainmenu internal">
            <h1>29-New Backgrounds</h1>
            <div class="logo-container">
                <img src="../src/imgs/logo-html.png" alt="Logo Challenge" class="module-logo">
            </div>
            <h3>New Features (multiple, gradients, clip)</h3>
        </header>

        <!-- Contenedores del reto -->
        <section class="demo-container">
            
            <!-- 1. Múltiples imágenes -->
            <div class="pixel-art-wrapper">
                <span class="wrapper-title">Múltiples Imágenes de Fondo</span>
                <div class="multiple-bg-box"></div>
            </div>

            <!-- 2. Gradiente de tres colores -->
            <div class="pixel-art-wrapper">
                <span class="wrapper-title">Gradiente de Tres Colores</span>
                <div class="gradient-box"></div>
            </div>

            <!-- 3. Bgs Linear Gradients -->
            <div class="pixel-art-wrapper">
                <span class="wrapper-title">bgs linear gradients</span>
                <div class="linear-gradient-box">Linear Gradient Box</div>
            </div>

            <!-- 4. Bgs Radial Gradients -->
            <div class="pixel-art-wrapper">
                <span class="wrapper-title">bgs radial gradients</span>
                <div class="radial-gradient-box">Radial Gradient Box</div>
            </div>

            <!-- 5. Bgs Clip Text -->
            <div class="pixel-art-wrapper">
                <span class="wrapper-title">bgs clip text</span>
                <div class="clip-text-box">
                    <span class="clip-text">CLIP TEXT</span>
                </div>
            </div>

            <!-- 6. Bgs Mask Clip -->
            <div class="pixel-art-wrapper">
                <span class="wrapper-title">bgs mask clip</span>
                <div class="mask-clip-box">Mask Clip Box</div>
            </div>

        </section>
    </main>

</body>
</html>
