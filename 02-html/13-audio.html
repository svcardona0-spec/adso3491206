<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punto 13 - Inserción de Audio</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #5c2a1a, #7c3e2a);
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .header-container {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .back-btn {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 50px;
            height: 50px;
            border: 2px solid white;
            border-radius: 50%;
            text-decoration: none;
            font-size: 30px;
            color: white;
            transition: transform 0.3s, background-color 0.3s;
            font-family: monospace;
        }

        .back-btn:hover {
            background-color: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
        }

        .page-title {
            color: white;
            font-size: 36px;
            font-weight: lighter;
            margin: 0;
            text-align: right;
        }

        .title-line {
            width: 200px;
            height: 4px;
            background-color: #00aaff;
            margin-left: auto;
            margin-top: 5px;
        }

        .audio-container {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 600px;
            box-sizing: border-box;
            text-align: center;
            margin-bottom: 30px;
        }

        .audio-container h2 {
            margin-top: 0;
            color: #7c3e2a;
            margin-bottom: 15px;
        }

        .audio-box {
            margin: 25px 0;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 12px;
            border: 1px solid #eee;
        }

        .audio-box h3 {
            margin-bottom: 15px;
            color: #555;
            font-size: 18px;
        }

        audio {
            width: 100%;
            max-width: 400px;
            outline: none;
        }

        p.desc {
            color: #666;
            font-size: 14px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="header-container">
        <a href="index.html" class="back-btn">←</a>
        <div>
            <h1 class="page-title">13-audio</h1>
            <div class="title-line"></div>
        </div>
    </div>

    <div class="audio-container">
        <h2>Inserción de Archivos de Audio</h2>
        <p class="desc">Reproductor multimedia con archivo local.</p>

        <div class="audio-box">
            <h3>Reproductor de Audio</h3>
            
            <audio controls>
                <source src="src/audio/sena.mp3" type="audio/mpeg">
                Tu navegador no soporta el elemento de audio.
            </audio>
        </div>

    </div>

</body>
</html>
