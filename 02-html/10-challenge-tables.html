    <title>10 - Challenge Tables: Table Heart</title>

        /* Botón de devolverse */
        .back-button {

            color: white;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            display: flex;

            text-decoration: none;

        }

            border: 2px solid #ff4d4d;

            padding: 20px;
            text-align: center;

        }

        h2 {
            color: #ff4d4d;
            font-size: 18px;
            margin-bottom: 15px;
            text-align: left;
        }

        /* Estructura de la tabla */
        table {
            border-collapse: collapse;
            background-color: #000000;
            border: 2px solid #ffffff;
            margin: 0 auto;
        }

        td {
            width: 20px;
            height: 20px;
            border: 1px solid #ffffff;
        }

        .heart {

    </style>
</head>
