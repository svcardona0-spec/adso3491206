<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punto 11 - Formularios Interactivos</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* Fondo oscuro degradado como en la imagen de referencia */
            background: linear-gradient(135deg, #5c2a1a, #7c3e2a);
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Estilo de la cabecera (contiene el botón y el título) */
        .header-container {
            width: 100%;
            max-width: 900px; /* Un poco más ancho para dar espacio al título */
            display: flex;
            justify-content: space-between; /* Botón a la izquierda, título a la derecha */
            align-items: center;
            margin-bottom: 30px;
            position: relative;
        }

        /* Estilo del botón de regreso (la flecha en el círculo) */
        .back-btn {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 50px;
            height: 50px;
            border: 2px solid white; /* Círculo blanco */
            border-radius: 50%;
            text-decoration: none;
            font-size: 30px; /* Tamaño de la flecha */
            color: white; /* Color de la flecha */
            transition: transform 0.3s, background-color 0.3s;
            font-family: monospace; /* Para usar el símbolo ← correctamente */
        }

        .back-btn:hover {
            background-color: rgba(255, 255, 255, 0.2); /* Efecto suave al pasar el mouse */
            transform: scale(1.1); /* Un pequeño zoom al pasar el mouse */
        }

        /* Estilo del título a la derecha (ej. "08-images") */
        .page-title {
            color: white;
            font-size: 36px;
            font-weight: lighter; /* Fuente delgada como en la referencia */
            margin: 0;
            text-align: right;
        }

        /* Estilo de la línea azul debajo del título */
        .title-line {
            width: 200px; /* Largo de la línea */
            height: 4px;
            background-color: #00aaff; /* Color cian/azul de la referencia */
            margin-left: auto; /* Alineado a la derecha */
            margin-top: 5px;
        }

        /* Estilo del contenedor del formulario */
        .form-container {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 500px;
            box-sizing: border-box;
        }

        /* Título dentro del formulario */
        .form-container h2 {
            margin-top: 0;
            color: #7c3e2a; /* Color marrón a juego con el fondo */
            text-align: center;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #444;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            background-color: #f9f9f9;
            transition: border-color 0.3s, background-color 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #7c3e2a;
            background-color: #fff;
            outline: none;
            box-shadow: 0 0 5px rgba(124, 62, 42, 0.3);
        }

        textarea {
            resize: vertical;
            height: 90px;
        }

        .radio-group, .checkbox-group {
            display: flex;
            gap: 20px;
            align-items: center;
            margin-top: 5px;
        }

        .radio-group label, .checkbox-group label {
            font-weight: normal;
            margin-bottom: 0;
            cursor: pointer;
        }

        button[type="submit"] {
            /* Botón con el color del fondo */
            background: linear-gradient(135deg, #5c2a1a, #7c3e2a);
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.3s;
            margin-top: 10px;
        }

        button[type="submit"]:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <!-- Cabecera con el botón y el título -->
    <div class="header-container">
        <!-- Botón de regreso (la flecha blanca en el círculo) -->
        <a href="index.html" class="back-btn">←</a>
        
        <!-- Título de la página a la derecha -->
        <div>
            <h1 class="page-title">11-forms</h1>
            <div class="title-line"></div>
        </div>
    </div>

    <!-- El formulario (igual que antes, pero con colores adaptados) -->
    <div class="form-container">
        <h2>Registro de Usuario</h2>
        <form action="#" method="POST">
            
            <div class="form-group">
                <label for="nombre">Nombre Completo:</label>
                <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre" required>
            </div>

            <div class="form-group">
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" name="email" placeholder="correo@ejemplo.com" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" placeholder="Mínimo 6 caracteres" required>
            </div>

            <div class="form-group">
                <label for="fecha">Fecha de Nacimiento:</label>
                <input type="date" id="fecha" name="fecha">
            </div>

            <div class="form-group">
                <label for="pais">País de Residencia:</label>
                <select id="pais" name="pais">
                    <option value="colombia">Colombia</option>
                    <option value="mexico">México</option>
                    <option value="espana">España</option>
                    <option value="argentina">Argentina</option>
                </select>
            </div>

            <div class="form-group">
                <label>Género:</label>
                <div class="radio-group">
                    <input type="radio" id="femenino" name="genero" value="femenino">
                    <label for="femenino">Femenino</label>
                    
                    <input type="radio" id="masculino" name="genero" value="masculino">
                    <label for="masculino">Masculino</label>
                </div>
            </div>

            <div class="form-group">
                <label>Intereses:</label>
                <div class="checkbox-group">
                    <input type="checkbox" id="fotografia" name="intereses" value="foto">
                    <label for="fotografia">Fotografía</label>
                    
                    <input type="checkbox" id="programacion" name="intereses" value="codigo">
                    <label for="programacion">Programación</label>
                </div>
            </div>

            <div class="form-group">
                <label for="comentarios">Comentarios o Mensaje:</label>
                <textarea id="comentarios" name="comentarios" placeholder="Escribe algo sobre ti..."></textarea>
            </div>

            <button type="submit">Enviar Formulario</button>

        </form>
    </div>

</body>
</html>
